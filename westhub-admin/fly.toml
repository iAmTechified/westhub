# fly.toml app configuration file generated for westhub-admin on 2026-04-29T12:34:32+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'westhub-admin'
primary_region = 'lhr'
console_command = 'php /var/www/html/artisan tinker'

[deploy]
  release_command = 'php artisan migrate --force'


[build]
  [build.args]
    NODE_VERSION = '18'
    PHP_VERSION = '8.2'


[env]
  APP_ENV = 'production'
  BCRYPT_ROUNDS = '12'
  BROADCAST_CONNECTION = 'log'
  CACHE_PREFIX = ''
  CACHE_STORE = 'database'
  CONTENT_DB_COLLATION = 'utf8mb4_unicode_ci'
  FILESYSTEM_DISK = 'local'
  LOG_CHANNEL = 'stderr'
  LOG_LEVEL = 'info'
  LOG_STDERR_FORMATTER = 'Monolog\Formatter\JsonFormatter'
  MEMCACHED_HOST = '127.0.0.1'
  QUEUE_CONNECTION = 'database'
  SESSION_DOMAIN = 'null'
  SESSION_DRIVER = 'cookie'
  SESSION_ENCRYPT = 'false'
  SESSION_LIFETIME = '120'
  SESSION_PATH = '/'
  SESSION_SECURE_COOKIE = 'true'
  VITE_APP_NAME = '${APP_NAME}'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[mounts]]
  source = "westhub_admin_storage"
  destination = "/var/www/html/storage/app/public"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
